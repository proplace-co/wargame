<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 120" role="img" aria-label="Maximum Insurance">
  <title>Maximum Insurance</title>
  <rect width="608" height="120" fill="#ffffff"/>
  <!-- Wordmark officiel : MAXIMUM [+ carré rouge] INSURANCE — fond blanc, marge 24px -->
  <g transform="translate(24,24)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    <text x="4" y="48" fill="#201e1d">MAXIMUM</text>
    <g transform="translate(247, 16)">
      <rect width="30" height="30" fill="#ec3013"/>
      <rect x="12" y="5" width="6" height="20" fill="#ffffff"/>
      <rect x="5" y="12" width="20" height="6" fill="#ffffff"/>
    </g>
    <text x="290" y="48" fill="#201e1d">INSURANCE</text>
  </g>
</svg>
