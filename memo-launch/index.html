<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Lancer un mémo détaillé · Proplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:32px;max-width:500px;width:100%;text-align:center}h1{font-size:18px;font-weight:600;color:#0f172a;margin-bottom:8px}.company{font-size:22px;font-weight:700;color:#1d4ed8;margin:12px 0 24px;word-break:break-word}.status{padding:16px;border-radius:8px;font-size:14px;line-height:1.55;margin-bottom:16px}.status.pending{background:#eff6ff;color:#1d4ed8}.status.ok{background:#ecfdf5;color:#047857}.status.err{background:#fef2f2;color:#b91c1c}.meta{font-size:12px;color:#64748b;margin-top:16px;text-align:left;background:#f8fafc;padding:12px;border-radius:6px;word-break:break-all}.meta strong{color:#334155}.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}button{background:#1d4ed8;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}button:hover{background:#1e40af}
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 Mémo détaillé</h1>
    <div id="company" class="company">…</div>
    <div id="status" class="status pending">Vérification requise avant tout débit.</div>
    <div id="meta" class="meta"></div>
    <button id="openBtn" type="button" hidden>Se connecter au cockpit · 3 crédits →</button>
  </div>
  <script>
    (function(){
      var params=new URLSearchParams(location.search);
      var company=(params.get('company_name')||'').trim();
      var fund=(params.get('fund_type')||'').trim();
      var status=document.getElementById('status');
      var button=document.getElementById('openBtn');
      var meta=document.getElementById('meta');
      document.getElementById('company').textContent=company||'(société manquante)';
      var fundLabel=document.createElement('strong');fundLabel.textContent='Fonds';
      var costLabel=document.createElement('strong');costLabel.textContent='Coût';
      meta.replaceChildren(fundLabel,document.createTextNode(' : '+(fund||'—')),
        document.createElement('br'),costLabel,document.createTextNode(' : 3 crédits'));
      if(!company||!fund){status.className='status err';status.textContent='Lien incomplet : société ou fonds manquant.';return;}
      status.className='status pending';
      status.textContent='Pour protéger vos crédits, ouvrez le lien sécurisé reçu dans votre Daily Brief ou reconnectez-vous.';
      button.hidden=false;
      button.onclick=function(){location.href='https://proplace.co/fr/compte/#login';};
    })();
  </script>
</body>
</html>
