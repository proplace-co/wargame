<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 72" role="img" aria-label="Maximum Insurance">
  <title>Maximum Insurance</title>
  <!-- Wordmark : MAXIMUM [+ carré rouge] INSURANCE — croix géométriquement centrée -->
  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    <text x="4" y="48" fill="#201e1d">MAXIMUM</text>
    <!-- Carré 30×30, croix 6px d'épaisseur parfaitement centrée -->
    <g transform="translate(247, 16)">
      <rect width="30" height="30" fill="#ec3013"/>
      <!-- verticale : x=(30-6)/2=12, y=(30-20)/2=5 -->
      <rect x="12" y="5" width="6" height="20" fill="#ffffff"/>
      <!-- horizontale : x=(30-20)/2=5, y=(30-6)/2=12 -->
      <rect x="5" y="12" width="20" height="6" fill="#ffffff"/>
    </g>
    <text x="290" y="48" fill="#201e1d">INSURANCE</text>
  </g>
</svg>
